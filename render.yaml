# Render Blueprint — static portfolio site
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: aaron-dickerson-portfolio
    runtime: static
    # No real build — the site is plain HTML/CSS/JS. Harmless no-op so Render
    # never tries to auto-detect a build step.
    buildCommand: echo "static site - nothing to build"
    # Serve everything from the repo root.
    staticPublishPath: .
    # Long cache for images/fonts; HTML stays fresh.
    headers:
      - path: /images/*
        name: Cache-Control
        value: public, max-age=86400
    pullRequestPreviewsEnabled: false
